<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This adjusts the webpage to fit different screen sizes -->
         <title>Avengers Character Search</title>
         <link rel="stylesheet" href="styles.css"><!-- Link to external stylesheet -->
         <script src="app.js" defer></script><!-- Link to external JavaScript file -->
    </head>
    <body>
        <header>
            <h1>Avengers Character Search</h1>
        </header>
        <main>
            <form id="search-form">
                <label for="search-input">Search by Full Name or Alias</label>
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="e.g. Captain America or Steve Rogers">
                    <button id="search-btn" type="submit">Search</button>
                </div>
            </form>
                <h2>RESULT</h2>
                <div id="result"><!-- Container for displaying search results --></div>
        </main>
    </body> 
</html>
